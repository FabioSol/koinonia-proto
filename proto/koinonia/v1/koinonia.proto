syntax = "proto3";

package koinonia.v1;

option go_package = "github.com/FabioSol/koinonia-proto/gen/koinonia/v1;koinoniav1";

// KoinoniaService is the core client<->backend contract: namespace/metadata RPCs,
// blob presign (bytes are never proxied through the API), OCC/CAS writes, draft
// publish, and a real-time invalidation stream.
//
// Conflicts are returned as gRPC status codes the FUSE client maps to errno:
//   FAILED_PRECONDITION (409) -> ESTALE   (version conflict)
//   INVALID_ARGUMENT    (422) -> EINVAL   (bad frontmatter)
//   PERMISSION_DENIED   (403) -> EACCES   (RBAC / branch protection)
//   NOT_FOUND                 -> ENOENT   (tombstone)
//   UNAVAILABLE               -> EAGAIN   (co-edit advisory lock)
// See koinonia-proto/docs/adrs/0002-grpc-service-contract.md.
service KoinoniaService {
  // Namespace / metadata (hot path).
  rpc Lookup(LookupRequest) returns (LookupResponse);
  rpc ReadDir(ReadDirRequest) returns (ReadDirResponse);
  rpc Getattr(GetattrRequest) returns (GetattrResponse);

  // Blobs: presigned URLs to an S3-compatible store; dedup pre-check.
  rpc BlobExists(BlobExistsRequest) returns (BlobExistsResponse);
  rpc PresignGet(PresignRequest) returns (PresignResponse);
  rpc PresignPut(PresignRequest) returns (PresignResponse);

  // Writes (OCC/CAS) and atomic draft publish.
  rpc Commit(CommitRequest) returns (CommitResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Publish(PublishRequest) returns (PublishResponse);

  // Time travel: resolve state as-of a global commit seq, and list a node's history.
  rpc AsOfLookup(AsOfLookupRequest) returns (LookupResponse);
  rpc AsOfReadDir(AsOfReadDirRequest) returns (ReadDirResponse);
  rpc NodeHistory(NodeHistoryRequest) returns (NodeHistoryResponse);

  // Named checkpoints (tags) pinning a global commit seq.
  rpc CreateCheckpoint(CreateCheckpointRequest) returns (CreateCheckpointResponse);
  rpc ListCheckpoints(ListCheckpointsRequest) returns (ListCheckpointsResponse);

  // Identity: obtain a JWT (dev issuer) and delegate an agent sub-token.
  rpc Login(LoginRequest) returns (TokenResponse);
  rpc IssueAgentToken(IssueAgentTokenRequest) returns (TokenResponse);

  // Space provisioning (ADR-0029): bootstrap a space, its root node, and the
  // caller's owner grant in one transaction. The only path that creates a space.
  rpc CreateSpace(CreateSpaceRequest) returns (CreateSpaceResponse);

  // Git interchange (ADR-0030): import a remote repo into a new space as an async
  // job; poll the job for progress/result.
  rpc ImportSpaceFromGit(ImportSpaceFromGitRequest) returns (SyncJob);
  rpc GetSyncJob(GetSyncJobRequest) returns (SyncJob);
  // Export a space's main tree to a new/empty repo as the initial commit (editor+).
  rpc ExportSpaceToNewRepo(ExportToNewRepoRequest) returns (SyncJob);
  // Export the diff since last sync back to the linked origin as a branch + PR.
  rpc ExportSpaceToOrigin(ExportToOriginRequest) returns (SyncJob);

  // Section display config (space default merged with the section's frontmatter)
  // and node authorship (byline attribution).
  rpc ResolveDisplay(ResolveDisplayRequest) returns (ResolveDisplayResponse);
  rpc SetNodeAuthors(SetNodeAuthorsRequest) returns (SetNodeAuthorsResponse);
  rpc GetNodeAuthors(GetNodeAuthorsRequest) returns (GetNodeAuthorsResponse);

  // Space render settings the browser needs (expiration policy). FUSE ignores it.
  rpc GetSpaceConfig(SpaceConfigRequest) returns (SpaceConfigResponse);

  // Engagement (browser-only): comments, reactions, reports.
  rpc AddComment(AddCommentRequest) returns (AddCommentResponse);
  rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse);
  rpc React(ReactRequest) returns (ReactionsResponse);
  rpc GetReactions(GetReactionsRequest) returns (ReactionsResponse);
  rpc Report(ReportRequest) returns (ReportResponse);

  // Full-text search (Postgres FTS). Results are unioned across the spaces the
  // caller's token grants >= viewer; intra-space filters to one space.
  rpc Search(SearchRequest) returns (SearchResponse);

  // Embeddable links (ADR-0022): publish/revoke a signed opaque slug for a node,
  // and resolve one on the public render path. Publish/Revoke need editor+;
  // Resolve is public and returns main-only targets, never drafts.
  rpc PublishEmbed(PublishEmbedRequest) returns (PublishEmbedResponse);
  rpc RevokeEmbed(RevokeEmbedRequest) returns (RevokeEmbedResponse);
  rpc ResolveEmbed(ResolveEmbedRequest) returns (ResolveEmbedResponse);

  // Real-time cache invalidation (thin deltas, no content).
  rpc Subscribe(SubscribeRequest) returns (stream Invalidation);
}

// A node in the tree (HEAD view). draft_id empty = main.
message Node {
  string logical_id = 1;
  string parent_id = 2;
  string name = 3;
  string kind = 4;            // space|section|article|folder
  string draft_id = 5;
  string content_hash = 6;    // SHA-256; empty for pure folders
  bytes frontmatter_json = 7;
  int32 version = 8;
  bool is_deleted = 9;
}

message LookupRequest {
  string parent_id = 1;
  string name = 2;
  string draft_id = 3;
}
message LookupResponse {
  Node node = 1;
}

message ReadDirRequest {
  string parent_id = 1;
  string draft_id = 2;
}
message ReadDirResponse {
  repeated Node nodes = 1;
}

message GetattrRequest {
  string logical_id = 1;
  string draft_id = 2;
}
message GetattrResponse {
  Node node = 1;
  int64 mtime_epoch = 2;      // base_epoch + version (deterministic)
  int64 size_bytes = 3;
}

message BlobExistsRequest {
  string content_hash = 1;
}
message BlobExistsResponse {
  bool exists = 1;
}

message PresignRequest {
  string content_hash = 1;
  string logical_id = 2;      // for RBAC scoping of the presign
}
message PresignResponse {
  string url = 1;
  int64 expires_at = 2;
}

message CommitRequest {
  string logical_id = 1;
  int32 expected_version = 2; // handle.baseVersion (immutable per open handle)
  string content_hash = 3;
  bytes frontmatter_json = 4; // client-parsed; server validates vs space schema
  string draft_id = 5;
  int64 size_bytes = 6;       // client-known blob size (registered for dedup + size reporting)
}
message CommitResponse {
  int32 new_version = 1;
}

message DeleteRequest {
  string logical_id = 1;
  int32 expected_version = 2;
  string draft_id = 3; // "" = tombstone main; else draft whiteout
}
message DeleteResponse {
  int32 new_version = 1;
}

message AsOfLookupRequest {
  string parent_id = 1;
  string name = 2;
  int64 seq = 3; // global commit seq; resolves the state as-of this point
}
message AsOfReadDirRequest {
  string parent_id = 1;
  int64 seq = 2;
}
message NodeHistoryRequest {
  string logical_id = 1;
}
message NodeHistoryResponse {
  repeated HistoryEntry entries = 1;
}
message HistoryEntry {
  int64 seq = 1;
  int32 version = 2;
  string content_hash = 3;
  int64 created_at = 4; // unix seconds
  bool is_deleted = 5;
}

message CreateCheckpointRequest {
  string space_id = 1;
  string branch = 2; // "" defaults to main
  string name = 3;
}
message CreateCheckpointResponse {
  int64 as_of_seq = 1;
}
message ListCheckpointsRequest {
  string space_id = 1;
  string branch = 2;
}
message ListCheckpointsResponse {
  repeated Checkpoint checkpoints = 1;
}
message Checkpoint {
  string name = 1;
  int64 as_of_seq = 2;
  int64 created_at = 3; // unix seconds
}

message ImportSpaceFromGitRequest {
  string remote = 1; // git URL (https/file)
  string ref = 2;    // branch/ref; "" -> the remote's default
  string slug = 3;   // slug for the new space
}
message GetSyncJobRequest {
  string job_id = 1;
}
message ExportToNewRepoRequest {
  string space_id = 1;
  string remote = 2; // target repo URL (must be empty/new)
}
message ExportToOriginRequest {
  string space_id = 1; // must be a linked space (imported/exported before)
}
// SyncJob is the state of an async import/export job.
message SyncJob {
  string id = 1;
  string space_id = 2; // set once the space exists
  string kind = 3;     // "import" | "export"
  string state = 4;    // pending|running|succeeded|failed
  int32 progress = 5;  // 0..100
  string detail = 6;   // current step
  string error = 7;    // populated on failure
  string result = 8;   // space id / repo / PR url
}

message CreateSpaceRequest {
  string slug = 1;          // unique space slug
  bytes settings_json = 2;  // optional space settings (JSON object); empty -> {}
}
message CreateSpaceResponse {
  string space_id = 1;
  string root_logical_id = 2; // the root 'space' node
}

message LoginRequest {
  string subject = 1; // dev issuer: the principal handle to log in as
}
message TokenResponse {
  string token = 1;
  int64 expires_at = 2; // unix seconds
}
message IssueAgentTokenRequest {
  string agent = 1; // agent name; the delegating user is the authenticated caller
}

message ResolveDisplayRequest {
  string logical_id = 1;
  string draft_id = 2;
}
message ResolveDisplayResponse {
  bytes config_json = 1; // space default merged with the section's display block
}
message SetNodeAuthorsRequest {
  string logical_id = 1;
  repeated string principals = 2; // principal handles (users or groups)
}
message SetNodeAuthorsResponse {}
message GetNodeAuthorsRequest {
  string logical_id = 1;
}
message GetNodeAuthorsResponse {
  repeated string principals = 1; // handles
}

message Comment {
  string id = 1;
  string logical_id = 2;
  string author = 3; // principal handle
  string body = 4;
  string parent_comment_id = 5;
  int64 created_at = 6; // unix seconds
  bool deleted = 7;
}
message AddCommentRequest {
  string logical_id = 1;
  string body = 2;
  string parent_comment_id = 3;
}
message AddCommentResponse {
  string comment_id = 1;
}
message ListCommentsRequest {
  string logical_id = 1;
}
message ListCommentsResponse {
  repeated Comment comments = 1;
}

message ReactRequest {
  string logical_id = 1;
  string kind = 2; // toggles the caller's reaction of this kind
}
message ReactionCount {
  string kind = 1;
  int64 count = 2;
}
message ReactionsResponse {
  repeated ReactionCount reactions = 1;
}
message GetReactionsRequest {
  string logical_id = 1;
}

message ReportRequest {
  string logical_id = 1;
  string reason = 2;
}
message ReportResponse {
  string report_id = 1;
}

message SpaceConfigRequest {
  string space_id = 1;
}
message SpaceConfigResponse {
  bool hide_expired = 1;      // filter expired nodes from listings + search
  int32 default_ttl_days = 2; // fallback TTL when an article omits an expiry (0 = none)
}

message PublishEmbedRequest {
  string logical_id = 1;
  string mode = 2;       // "live" (tracks HEAD) | "pinned" (fixed seq)
  int64 pinned_seq = 3;  // required when mode = pinned
}
message PublishEmbedResponse {
  string token = 1; // opaque signed token for the public URL (slug.signature)
  string slug = 2;  // the bare slug (owners revoke by slug)
}
message RevokeEmbedRequest {
  string slug = 1;
}
message RevokeEmbedResponse {}
message ResolveEmbedRequest {
  string token = 1;
}
message ResolveEmbedResponse {
  string status = 1; // "ok" | "not_found" | "revoked"
  string logical_id = 2;
  string space_id = 3;
  string mode = 4;
  int64 pinned_seq = 5;
}

message SearchRequest {
  string query = 1;
  string space_id = 2;    // "" = inter-space (all granted); else that one space
  bool hide_expired = 3;  // drop results whose expiry_date has passed
  map<string, string> facet_filters = 4; // fm_facets @> {k:v} narrowing
  string facet_key = 5;   // aggregate value counts for this frontmatter key
  int32 limit = 6;        // 0 -> server default
}
message SearchHit {
  string logical_id = 1;
  string space_id = 2;
  string title = 3;       // fm_facets.title (falls back to name client-side)
  string snippet = 4;     // ts_headline over the plaintext
  double rank = 5;        // ts_rank
  bytes facets_json = 6;  // the node's frontmatter facets
}
message SearchFacet {
  string key = 1;
  string value = 2;
  int64 count = 3;
}
message SearchResponse {
  repeated SearchHit hits = 1;
  repeated SearchFacet facets = 2; // value counts for facet_key (when requested)
}

message PublishRequest {
  string draft_id = 1;
}
message PublishResponse {
  bool ok = 1;
  repeated ConflictFile conflicts = 2; // populated when ok = false (409)
}
message ConflictFile {
  string logical_id = 1;
  string path = 2;
  int32 base_version = 3;
  int32 current_version = 4;
}

message SubscribeRequest {
  string space_id = 1;
}
message Invalidation {
  string logical_id = 1;
  int32 version = 2;
  string draft_id = 3;
  string parent_id = 4;
}
